name: e2e

on:
  pull_request:
  workflow_dispatch:
    inputs:
      rook_version:
        description: "Rook Ceph chart version to install"
        required: false
        default: "v1.15.0"

# Cancel superseded runs on the same ref.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast gate: unit + envtest integration tests. Always runs.
  unit-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build & vet
        run: |
          go build ./...
          go vet ./...

      - name: Unit tests
        run: make test

      - name: Install envtest binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.19
          echo "ENVTEST_ASSETS=$("$(go env GOPATH)/bin/setup-envtest" use 1.31.0 -p path)" >> "$GITHUB_ENV"

      - name: Integration tests (envtest)
        run: make test-integration ENVTEST_ASSETS="${ENVTEST_ASSETS}"

  # Full end-to-end: kind cluster + Rook Ceph + operator + data-integrity check.
  e2e-kind:
    runs-on: ubuntu-latest
    needs: unit-integration
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker image prune -af || true

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install helm
        uses: azure/setup-helm@v4

      - name: Run e2e (kind + Rook + operator)
        env:
          CLUSTER: rookpp-e2e
          ROOK_VERSION: ${{ github.event.inputs.rook_version || 'v1.15.0' }}
        run: make e2e-kind

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          set +e
          kubectl get storagecluster -o yaml
          kubectl -n rook-ceph get pods -o wide
          kubectl -n rook-ceph get cephcluster,cephblockpool -o yaml
          kubectl -n rookpp-system logs deploy/rookpp-controller --tail=200
          kubectl get events -A --sort-by=.lastTimestamp | tail -100

      - name: Tear down kind cluster
        if: always()
        run: kind delete cluster --name rookpp-e2e || true
