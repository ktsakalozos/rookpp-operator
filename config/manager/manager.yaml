apiVersion: v1
kind: Namespace
metadata:
  name: storage-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-operator-controller
  namespace: storage-operator-system
  labels:
    app: storage-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-operator
  template:
    metadata:
      labels:
        app: storage-operator
    spec:
      serviceAccountName: storage-operator
      containers:
        - name: manager
          image: ghcr.io/jackal/storage-operator:latest
          args:
            - --leader-elect
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: storage-operator-disk-scanner
  namespace: storage-operator-system
  labels:
    app: storage-operator-disk-scanner
spec:
  selector:
    matchLabels:
      app: storage-operator-disk-scanner
  template:
    metadata:
      labels:
        app: storage-operator-disk-scanner
    spec:
      serviceAccountName: storage-operator
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: ghcr.io/jackal/storage-operator-agent:latest
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          args:
            - --interval=60s
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: sys
          hostPath:
            path: /sys
